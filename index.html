<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tractor Variant Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#2f6b27;--green-d:#1f4a1a;--yellow:#ffde00;--paper:#f2f3ec;--card:#fff;--ink:#1a251a;--mute:#5d6a5d;--line:#d9dcd0;--rust:#a8321f;--bg:var(--paper)}
@media(prefers-color-scheme:dark){:root{--paper:#121a12;--card:#1b261b;--ink:#eef2e8;--mute:#9fae9f;--line:#2f3f2f;--green:#5fae52;--green-d:#0d1a0d;--rust:#e8745f}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:500 15px/1.4 Barlow,system-ui,sans-serif}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
header{background:var(--green-d);color:#fff;border-bottom:5px solid var(--yellow)}
.bar{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font:700 24px/1 'Barlow Condensed',sans-serif;margin:0;letter-spacing:.01em;margin-right:auto}
h1 small{display:block;font:400 13px Barlow;opacity:.75;margin-top:4px;letter-spacing:0}
.find{display:flex;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden}
.find input{background:none;border:0;padding:9px 12px;width:210px;color:#fff;text-transform:uppercase}
.find input::placeholder{color:#fff9;text-transform:none}
.find button{border:0;background:var(--yellow);color:#1a251a;padding:0 14px;font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid #fff6;color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
main{max-width:1120px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
h2{font:700 13px 'Barlow Condensed';letter-spacing:.06em;color:var(--mute);margin:0 0 8px;text-transform:uppercase}
.series{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.series:first-of-type{border-top:0}
.series b{width:112px;flex:none;font-weight:600;font-size:14px;line-height:1.2}
.series b span{display:block;font-weight:400;color:var(--mute);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border:2px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--green)}
.chip[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.chip.model{font:700 20px 'Barlow Condensed';padding:0 18px}
.done{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.done span{width:130px;color:var(--mute);flex:none}
.done b{flex:1}
.done button{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;text-decoration:underline;min-height:36px}
.now{margin-top:16px;padding:16px;background:var(--card);border-left:6px solid var(--yellow);border-radius:0 10px 10px 0}
.now h3{margin:0 0 10px;font:700 22px 'Barlow Condensed'}
.now h3 small{font:400 14px Barlow;color:var(--mute);margin-left:8px}
aside{position:sticky;top:12px;background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.codebar{padding:18px 20px;background:var(--green-d);color:#fff}
.codebar .st{font-size:13px;opacity:.8}
.code{font:700 44px/1.05 'Barlow Condensed';letter-spacing:.04em;color:var(--yellow);margin:4px 0;font-variant-numeric:tabular-nums;user-select:all}
.codebar .sub{font-size:13px;opacity:.85}
[data-state=progress] .code{font-size:30px;color:#fff}
[data-state=idle] .code{color:#fff6}
[data-state=none] .codebar{background:var(--rust)}
[data-state=none] .code{color:#fff}
.specs{padding:6px 20px 4px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span{color:var(--mute)}
.row b{text-align:right}
.row i{font:600 11px Barlow;background:var(--paper);padding:1px 6px;border-radius:4px;margin-left:6px;color:var(--mute);font-style:normal}
.empty{color:var(--mute);padding:16px 0}
.act{display:flex;gap:8px;padding:14px 20px 18px}
.act button{flex:1;min-height:44px;border-radius:8px;border:2px solid var(--green);background:var(--green);color:#fff;font-weight:600;cursor:pointer}
.act button+button{background:none;color:var(--green);flex:none;padding:0 18px}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){
main{grid-template-columns:1fr;padding-bottom:110px}
aside{position:static}
.codebar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px;border-top:4px solid var(--yellow)}
.code{font-size:32px}[data-state=progress] .code{font-size:24px}
.series{flex-direction:column;gap:6px}.series b{width:auto}
.find{width:100%}.find input{flex:1;width:auto}
.done span{width:100px}
}
@media print{header,#left,.act,.find{display:none}main{display:block}aside{border:0}.codebar{position:static;background:none;color:#000;border:0;padding:0}.code{color:#000}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

#cmp{max-width:1120px;margin:20px auto 0;padding:0 16px}
#cmp[hidden]{display:none}
.cmpbox{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--yellow);border-radius:12px;padding:16px 20px}
.cmphead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cmphead h2{margin:0 auto 0 0;font-size:20px;color:var(--ink)}
.cmphead label{display:flex;gap:6px;align-items:center;cursor:pointer}
.cmphead button{min-height:40px;padding:0 14px;border-radius:8px;border:2px solid var(--green);background:none;color:var(--green);font-weight:600;cursor:pointer}
.cg{display:grid;grid-template-columns:130px 1fr 1fr;font-size:14px}
.cg>div{padding:8px 10px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.cg .l{color:var(--mute)}
.cg .h{border-bottom:2px solid var(--green);padding-bottom:12px}
.cg .h .code{font-size:30px;color:var(--ink);margin:0}
.cg .h small{display:block;color:var(--mute)}
.cg .h button{background:none;border:0;color:var(--rust);cursor:pointer;text-decoration:underline;padding:0;margin-top:4px}
.cg .h form{display:flex;gap:6px}
.cg .h input{flex:1;min-width:0;min-height:42px;border:2px solid var(--line);border-radius:8px;padding:0 10px;background:var(--paper);text-transform:uppercase}
.cg .h form button{margin:0;text-decoration:none;background:var(--green);color:#fff;border-radius:8px;padding:0 12px;min-height:42px}
.cg .d{background:color-mix(in srgb,var(--yellow) 35%,transparent);font-weight:700}
.cmpsum{margin:10px 0 0;color:var(--mute)}
@media(max-width:900px){.cg{grid-template-columns:84px 1fr 1fr;font-size:13px}.cg .h .code{font-size:22px}.cg .h form{flex-direction:column}}
@media print{#cmp{display:none}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>Tractor variant finder<small>Pick a model and options to get the variant code</small></h1>
  <form class="find" id="findForm"><input id="findInput" placeholder="Look up a variant code" aria-label="Variant code" autocomplete="off"><button>Find</button></form>
  <button class="ghost" id="resetAllBtn">Start over</button>
</div></header>
<section id="cmp" hidden></section>
<main>
  <section id="left">
    <h2>Model</h2>
    <div id="modelRadioContainer"></div>
    <div id="stepsContainer"></div>
  </section>
  <aside id="result" data-state="idle">
    <div class="codebar" aria-live="polite">
      <div class="st" id="cardStatusBadge"></div>
      <div class="code" id="displayVariantCode">--</div>
      <div class="sub" id="resolvedVariantSubtitle"></div>
    </div>
    <div class="specs" id="summarySpecList"></div>
    <div class="act"><button id="copySummaryBtn">Copy spec</button><button id="cmpAddBtn" style="flex:1">Add to compare</button><button id="printSpecBtn">Print</button></div>
  </aside>
</main>
<div id="toast" role="status"></div>

        // Standardize SessionID
        let sessVal = (item.SessionID || "").trim();
        if (!sessVal || sessVal === "#N/A") sessVal = "ID-" + (item.Variant || "SYS").substring(0, 5);

        // Keep raw model string cleanly with robust normalization
        let rawModel = (item.MODEL || "").trim();
        if (rawModel.toUpperCase() === "5210") rawModel = "5210E";
        if (rawModel.toUpperCase() === "5075") rawModel = "5075E";
        if (rawModel.toUpperCase() === "5310") rawModel = "5310E";
        if (rawModel.toUpperCase() === "5405") rawModel = "5405E";

        return {
          variant: (item.Variant || "").trim(),
          desiText: (item["Desi Text"] || "").trim(),
          model: rawModel,
          drive: (item.Drive || "").trim(),
          transmission: (item.Transmission || "").trim(),
          clutch: clutchVal,
          frontTyre: (item["Front Tyre"] || "").trim(),
          TyreType: tyreTypeVal,
          comfort: comfortVal,
          hydraulics: (item.Hydraulics || "").trim(),
          rearTyre: (item["Rear Tyre"] || "").trim(),
          scv: scvVal,
          pto: (item["PTO Speed"] || item.PTO || "").trim(),
          telematics: (item["JD Link/GS Link"] || "").trim(),
          light: (item.LIGHT || "").trim(),
          lifting: liftVal,
          threePointLinks: (item["3Point Links"] || "").trim(),
          rops: ropsVal,
          sessionId: sessVal,
          platform: (item.Platform || "").trim()
        };
      });

    // Current working catalog
    let catalog = JSON.parse(JSON.stringify(INITIAL_CATALOG));

    /**
     * Exact requested sequence of dependent attributes from user feedback:
     */
    const FLOW_STEPS = [
      { key: "drive", label: "Drive" },
      { key: "transmission", label: "Transmission" },
      { key: "clutch", label: "Clutch" },
      { key: "frontTyre", label: "Front Tyre" },
      
      { key: "TyreType", label: "Tyre Type" },
      { key: "scv", label: "SCV" },
      { key: "lifting", label: "Lift Capacity" },
      { key: "hydraulics", label: "Hydraulics" },
      { key: "rearTyre", label: "Rear Tyre" },
 
      { key: "pto", label: "PTO Speed" },
      

      { key: "comfort", label: "Operator Comfort" },

      { key: "telematics", label: "JD Link / GS Link" },
      { key: "light", label: "Light" },
            { key: "threePointLinks", label: "3Point Links" },
      { key: "rops", label: "ROPS" }
    ];

    // State of user selections
    let selections = { model: "" };
    FLOW_STEPS.forEach(s => selections[s.key] = "");
    let autoSelectedMap = {};

const $=id=>document.getElementById(id);
function showToast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(showToast.h);showToast.h=setTimeout(()=>t.classList.remove("on"),2500)}
function getMatches(f){return catalog.filter(i=>Object.entries(f).every(([k,v])=>!v||String(i[k]).trim().toLowerCase()===String(v).trim().toLowerCase()))}
function getAvailableOptions(key,cur){const t={...cur};delete t[key];const s=new Set();getMatches(t).forEach(m=>{if(m[key]!=null&&String(m[key]).trim()!=="")s.add(String(m[key]).trim())});return[...s].sort()}
const PLATFORM_GROUPS=[
 {name:"3E",note:"Compact, orchard",order:["3028EN","3036EN","3036E"]},
 {name:"5D",note:"Utility, puddling",order:["5036D","5105D","5039D","5042D","5045D","5050D"]},
 {name:"5E",note:"Heavy duty, commercial",order:["5210E","5310E","5405E","5075E"]}];
function chip(label,on,cls,fn){const b=document.createElement("button");b.type="button";b.className="chip "+(cls||"");b.setAttribute("aria-pressed",on);b.textContent=label;b.onclick=fn;return b}
function clearFrom(i){for(let j=i;j<FLOW_STEPS.length;j++){selections[FLOW_STEPS[j].key]="";autoSelectedMap[FLOW_STEPS[j].key]=false}}
function renderModelSelector(){
 const c=$("modelRadioContainer");c.innerHTML="";
 const have=new Set(catalog.map(x=>x.model.trim().toUpperCase()));
 PLATFORM_GROUPS.forEach(g=>{
  const ms=g.order.filter(m=>have.has(m));if(!ms.length)return;
  const r=document.createElement("div");r.className="series";
  r.innerHTML=`<b>${g.name} series<span>${g.note}</span></b>`;
  const ch=document.createElement("div");ch.className="chips";
  ms.forEach(m=>ch.appendChild(chip(m,selections.model.toUpperCase()===m,"model",()=>{
   if(selections.model.toUpperCase()===m)return;
   selections.model=m;clearFrom(0);autoSelectedMap={};renderModelSelector();runSteppedFlow()})));
  r.appendChild(ch);c.appendChild(r)})}
function runSteppedFlow(){
 const w=$("stepsContainer");w.innerHTML="";
 if(selections.model){
  const f={model:selections.model};
  for(let i=0;i<FLOW_STEPS.length;i++){
   const st=FLOW_STEPS[i],opts=getAvailableOptions(st.key,f);
   if(!opts.length)break;
   if(opts.length===1){selections[st.key]=opts[0];autoSelectedMap[st.key]=true;f[st.key]=opts[0];continue}
   autoSelectedMap[st.key]=false;
   if(selections[st.key]){
    const d=document.createElement("div");d.className="done";
    d.innerHTML=`<span>${st.label}</span><b>${selections[st.key]}</b><button type="button">Change</button>`;
    d.querySelector("button").onclick=()=>{clearFrom(i);runSteppedFlow()};
    w.appendChild(d);f[st.key]=selections[st.key];continue}
   const n=document.createElement("div");n.className="now";
   n.innerHTML=`<h3>${st.label}<small>${opts.length} options</small></h3>`;
   const ch=document.createElement("div");ch.className="chips";
   opts.forEach(o=>ch.appendChild(chip(o,false,"",()=>{selections[st.key]=o;clearFrom(i+1);runSteppedFlow()})));
   n.appendChild(ch);w.appendChild(n);break}}
 updateTargetDisplay()}
function resolve(){
 const f={};if(selections.model)f.model=selections.model;
 FLOW_STEPS.forEach(s=>{if(selections[s.key])f[s.key]=selections[s.key]});
 const m=getMatches(f),all=FLOW_STEPS.every(s=>selections[s.key]);
 let state="progress",pick=null;
 if(!selections.model)state="idle";
 else if(!m.length)state="none";
 else if(m.length===1||all){state="done";pick=m.find(x=>x.variant.toUpperCase().includes("PY"))||m[0]}
 return{f,m,state,pick}}
function updateTargetDisplay(){
 const{f,m,state,pick}=resolve();
 $("result").dataset.state=state;
 const L=$("summarySpecList");L.innerHTML="";
 const row=(a,b,auto)=>{const d=document.createElement("div");d.className="row";d.innerHTML=`<span>${a}</span><b>${b}${auto?"<i>auto</i>":""}</b>`;L.appendChild(d)};
 if(state==="idle")L.innerHTML='<div class="empty">Choose a model to begin, or look up a variant code above.</div>';
 else{row("Model",selections.model);FLOW_STEPS.forEach(s=>{if(selections[s.key])row(s.label,selections[s.key],autoSelectedMap[s.key])})}
 const code=$("displayVariantCode"),st=$("cardStatusBadge"),sub=$("resolvedVariantSubtitle");
 if(state==="idle"){st.textContent="Variant code";code.textContent="--";sub.textContent="Nothing selected yet"}
 else if(state==="none"){st.textContent="No match";code.textContent="N/A";sub.textContent="No variant has this combination. Change a choice or start over."}
 else if(state==="done"){
  const alt=m.find(x=>/VY|DY/i.test(x.variant)&&x!==pick);
  st.textContent=/PY/i.test(pick.variant)?"Final variant · Pune plant":"Final variant";
  code.textContent=pick.variant;
  sub.textContent=[pick.desiText||pick.model,alt?"Dewas alternate: "+alt.variant:""].filter(Boolean).join(" · ")}
 else{st.textContent="Narrowing down";code.textContent=m.length+" variants left";sub.textContent=Object.keys(f).length-1+" options chosen so far"}
 $("footerRef").textContent=state==="done"?pick.sessionId:""}
function lookup(q){
 q=q.trim().toUpperCase();if(!q)return;
 const it=catalog.find(c=>c.variant.toUpperCase()===q)||catalog.find(c=>c.variant.toUpperCase().startsWith(q));
 if(!it){showToast("No variant found for "+q);return}
 selections.model=it.model;clearFrom(0);autoSelectedMap={};
 FLOW_STEPS.forEach(s=>selections[s.key]=it[s.key]);
 renderModelSelector();runSteppedFlow();showToast("Showing "+it.variant)}
$("findForm").onsubmit=e=>{e.preventDefault();lookup($("findInput").value)};
$("resetAllBtn").onclick=()=>{selections.model="";clearFrom(0);autoSelectedMap={};$("findInput").value="";renderModelSelector();runSteppedFlow();showToast("Cleared. Choose a model to begin.")};
$("copySummaryBtn").onclick=()=>{
 const{state,pick}=resolve();
 const lines=["Variant: "+$("displayVariantCode").innerText,"Model: "+(selections.model||"N/A")];
 FLOW_STEPS.forEach(s=>{if(selections[s.key])lines.push(s.label+": "+selections[s.key])});
 if(state==="done")lines.push("Ref: "+pick.sessionId);
 lines.push("Generated: "+new Date().toLocaleString());
 const t=document.createElement("textarea");t.value=lines.join("\n");document.body.appendChild(t);t.select();
 try{document.execCommand("copy");showToast("Spec copied")}catch(e){showToast("Couldn't copy")}
 t.remove()};
$("printSpecBtn").onclick=()=>window.print();

let cmp=[null,null],onlyDiff=false;
const CMP_ROWS=[["model","Model"],["platform","Series"],...FLOW_STEPS.map(s=>[s.key,s.label])];
function findVariant(q){q=q.trim().toUpperCase();return q&&(catalog.find(c=>c.variant.toUpperCase()===q)||catalog.find(c=>c.variant.toUpperCase().startsWith(q)))}
function addCmp(it,slot){
 if(cmp.some(x=>x&&x.variant===it.variant)){showToast(it.variant+" is already in the comparison");return}
 let i=slot!=null?slot:cmp.findIndex(x=>!x);
 if(i<0){cmp[0]=cmp[1];i=1}
 cmp[i]=it;renderCmp();$("cmp").scrollIntoView({block:"start"})}
const same=(a,b)=>String(a).trim().toLowerCase()===String(b).trim().toLowerCase();
function renderCmp(){
 const P=$("cmp");P.hidden=!(cmp[0]||cmp[1]);if(P.hidden)return;
 const both=cmp[0]&&cmp[1];
 const rows=CMP_ROWS.map(([k,l])=>({k,l,d:both&&!same(cmp[0][k],cmp[1][k])}));
 const nd=rows.filter(r=>r.d).length;
 const head=i=>cmp[i]?`<div class="h"><div class="code">${cmp[i].variant}</div><small>${cmp[i].desiText||cmp[i].model}</small><button data-rm="${i}">Remove</button></div>`
  :`<div class="h"><form data-slot="${i}"><input placeholder="Variant code" aria-label="Variant code for slot ${i+1}"><button>Add</button></form><small>Or build one above and press Add to compare</small></div>`;
 let h=`<div class="cmpbox"><div class="cmphead"><h2>Compare variants</h2>${both?`<label><input type="checkbox" id="onlyDiff" ${onlyDiff?"checked":""}> Show differences only</label><button id="cmpCopy">Copy comparison</button>`:""}<button id="cmpClose">Close</button></div><div class="cg"><div class="h"></div>${head(0)}${head(1)}`;
 rows.forEach(r=>{if(onlyDiff&&both&&!r.d)return;
  const c=i=>`<div class="${r.d?"d":""}">${cmp[i]?cmp[i][r.k]||"-":""}</div>`;
  h+=`<div class="l">${r.l}</div>${c(0)}${c(1)}`});
 h+=`</div>`;
 if(both)h+=`<p class="cmpsum">${nd?nd+" of "+rows.length+" specs differ.":"All specs are identical. These variants differ only by code or plant."}</p>`;
 P.innerHTML=h+"</div>";
 P.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{cmp[+b.dataset.rm]=null;renderCmp()});
 P.querySelectorAll("form[data-slot]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const it=findVariant(f.querySelector("input").value);it?addCmp(it,+f.dataset.slot):showToast("No variant found")});
 $("cmpClose").onclick=()=>{cmp=[null,null];renderCmp()};
 const od=$("onlyDiff");if(od)od.onchange=()=>{onlyDiff=od.checked;renderCmp()};
 const cc=$("cmpCopy");if(cc)cc.onclick=()=>{
  const t=document.createElement("textarea");
  t.value=["Compare: "+cmp[0].variant+" vs "+cmp[1].variant,...rows.map(r=>(r.d?"* ":"  ")+r.l+": "+cmp[0][r.k]+" | "+cmp[1][r.k])].join("\n");
  document.body.appendChild(t);t.select();try{document.execCommand("copy");showToast("Comparison copied")}catch(e){showToast("Couldn't copy")}t.remove()}}
$("cmpAddBtn").onclick=()=>{const{state,pick}=resolve();state==="done"?addCmp(pick):showToast("Finish choosing a variant first, then add it")};
window.onload=()=>{renderModelSelector();runSteppedFlow()};
</script>
<span id="footerRef" hidden></span>
</body>
</html>
